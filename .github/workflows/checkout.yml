name: 'Checkout'

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'bugfix/**'
    paths:
      - '.github/**.yaml'
      - '.github/**.yml'
      - 'codecov.yml'
      - 'jest.config*.mjs'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'bin/**.js'
      - 'src/**'
      - 'test/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test and Coverage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Get latest code
        id: checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            .gitignore
            codecov.yml
            package.json
            package-lock.json
            tsconfig.json
            bin
            scripts
            src
            test
            example
            CHANGELOG.md
            MIGRATION.md
            README.md

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Generate Coverage Reports
        run: npm run coverage

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sheety-localization-coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/source/lcov.info
            coverage/source/coverage-summary.json
            coverage/generated-runtime/lcov.info
            coverage/generated-runtime/coverage-summary.json
            coverage/cli-result/lcov.info
            coverage/cli-result/coverage-summary.json
          if-no-files-found: error

      - name: Upload Merged Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: merged
          name: sheety-localization-merged
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload Source Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/source/lcov.info
          flags: source
          name: sheety-localization-source
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload Generated Runtime Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/generated-runtime/lcov.info
          flags: generated-runtime
          name: sheety-localization-generated-runtime
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload CLI Result Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/cli-result/lcov.info
          flags: cli-result
          name: sheety-localization-cli-result
          fail_ci_if_error: true
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  notify:
    name: Notify CI result
    needs: [test]
    continue-on-error: true
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Report missing notification secrets
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS == '' ||
          env.NOTIFY_TELEGRAM_BOT_TOKEN == '' ||
          env.NOTIFY_TELEGRAM_TARGETS == ''
        run: echo "::warning::CI notification skipped because notification secrets are not fully configured."

      - name: Checkout trusted notification template
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Notify Discord and Telegram
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != '' &&
          hashFiles('.github/notify/templates/ci.md') != ''
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/ci.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: best-effort
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
