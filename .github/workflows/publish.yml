name: 'Publish to npm'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
      - 'v[0-9]+.[0-9]+.[0-9]-*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 'Publish to npm'
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ./
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        id: node-setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-compatible npm
        run: npm install --global npm@11.15.0

      - name: Run npm ci
        id: npm-ci
        run: npm ci

      - name: Verify release tag
        id: package
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error title=Release tag mismatch::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "spec=${package_name}@${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: npm test

      - name: Build release artifacts
        run: npm run build

      - name: Check npm registry
        id: registry
        shell: bash
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.spec }}
        run: |
          set +e
          registry_output="$(npm view "${PACKAGE_SPEC}" version 2>&1)"
          registry_status=$?
          set -e

          if [[ ${registry_status} -eq 0 ]]; then
            echo "npm registry already contains ${PACKAGE_SPEC}."
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${registry_output}" == *"E404"* ]]; then
            echo "npm registry does not contain ${PACKAGE_SPEC}; publication is required."
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${registry_output}" >&2
            echo "::error title=npm registry check failed::npm view ${PACKAGE_SPEC} exited with code ${registry_status}. This is not treated as an unpublished version."
            exit "${registry_status}"
          fi

      - name: Publish to npm
        id: publish
        if: steps.registry.outputs.already_published != 'true'
        shell: bash
        run: |
          set +e
          npm publish --access public
          publish_status=$?
          set -e

          if [[ ${publish_status} -ne 0 ]]; then
            echo "::error title=npm OIDC publish failed::npm publish exited with code ${publish_status}. Verify that npm Trusted Publishing matches ziqq/sheety-localization and publish.yml, allows npm publish, and that this job has id-token: write."
            exit "${publish_status}"
          fi

      - name: Verify npm publication
        shell: bash
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.spec }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            set +e
            published_version="$(npm view "${PACKAGE_SPEC}" version 2>&1)"
            registry_status=$?
            set -e

            if [[ ${registry_status} -eq 0 && "${published_version}" == "${PACKAGE_VERSION}" ]]; then
              echo "Verified ${PACKAGE_SPEC} in the npm registry."
              exit 0
            fi

            printf 'Registry verification attempt %s failed: %s\n' \
              "${attempt}" "${published_version}" >&2
            if [[ ${attempt} -lt 20 ]]; then
              sleep 15
            fi
          done

          echo "::error title=npm publication verification failed::The npm registry did not return ${PACKAGE_SPEC} within five minutes. GitHub Release creation has been stopped."
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists."
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --latest \
            --title "${RELEASE_TAG}" \
            --generate-notes


  complete-issues:
    name: Complete issues after successful publication
    needs: [deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release or deploy result
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
